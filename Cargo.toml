[package]
name = "quicksliver"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.94"
clap = { version = "4.5.23", features = ["derive"] }
eframe = "0.30.0"
egui = "0.30.0"
prost = "0.13.4"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.12.3", features = ["transport", "tls"] }

[build-dependencies]
tonic-build = "0.12.3"
